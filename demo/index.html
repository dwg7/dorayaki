<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dorayaki surfel demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <script type="importmap">
      { "imports": { "maplibre-gl": "/node_modules/maplibre-gl/dist/maplibre-gl.mjs" } }
    </script>
    <style>
      html, body, #map { margin: 0; height: 100%; }
      #panel {
        position: absolute; top: 10px; left: 10px; z-index: 1;
        background: rgba(255, 255, 255, 0.9); padding: 8px 10px;
        font: 13px/1.4 system-ui, sans-serif; border-radius: 4px; max-width: 22em;
      }
      #panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6em; }
      #panel-toggle {
        font: inherit; line-height: 1; width: 1.6em; height: 1.6em; padding: 0; cursor: pointer;
        border: 1px solid #999; border-radius: 3px; background: #fff;
      }
      #panel.min #panel-body { display: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <div id="panel-head">
        <span><strong>Dorayaki</strong>: experimental surfel frame</span>
        <button id="panel-toggle" type="button" aria-label="Minimize the panel" aria-expanded="true" title="Minimize">&minus;</button>
      </div>
      <div id="panel-body">
        fixture: <span id="fixture"></span><br />
        <span id="status">loading…</span><br />
        <label><input type="checkbox" id="depth" checked /> depth test</label><br />
        <label title="Uses the tile's class plane when it has one; otherwise a guess from the splats (height above the local ground, round shape)"><input type="checkbox" id="hideveg" /> hide vegetation</label><br />
        <label title="Color by class (false color) needs tiles with a class plane (E021)">color: <select id="colormode"><option value="stored">stored</option><option value="class">by class</option></select></label>
        <details id="tune" style="margin-top: 4px">
          <summary title="Drawing parameters; the link below reproduces them">look</summary>
          <label>basemap: <select id="basemap"><option value="nightsky">bvmap-nightsky (dark)</option><option value="starlight">bvmap-starlight (light)</option></select></label><br />
          <label><input type="checkbox" id="soft" /> soft look (Gaussian-feathered)</label>
          <div id="tune-body" style="display:grid;gap:2px"></div>
          <button id="tune-reset" type="button" style="font:inherit;margin-top:3px">reset</button>
          <a id="tune-link" href="#" style="margin-left:0.6em">link</a>
        </details>
        <div id="legend" style="font-size: 11px; line-height: 1.5"></div>
        <small>Red dashed line: tile boundary. Ctrl/right-drag to rotate and pitch.</small>
      </div>
    </div>
    <script type="module" src="/demo/build/main.js"></script>
  </body>
</html>
